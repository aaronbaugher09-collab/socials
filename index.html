<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ms. Ashlyn Baugher</title>

<style>
:root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --button: #BEBEBB;
    --button-hover: #AD9D90;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #000000;
        --card: #1c1c1e;
        --text: #ffffff;
        --button: #BEBEBB;
        --button-hover: #AD9D90;
    }
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
}

.banner {
    height: 220px;
    background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)),
        url("Flowers.JPG");
    background-size: cover;
    background-position: center;
}

.profile {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    margin: -75px auto 0;
    border: 5px solid white;
    background: white;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
}

.content {
    padding: 20px 30px 30px;
    text-align: center;
}

h1 {
    margin: 10px 0 5px;
    font-size: 32px;
}

.subtitle {
    opacity: .75;
    margin-bottom: 20px;
}

.bio {
    line-height: 1.6;
    opacity: .8;
    margin-bottom: 30px;
}

.link {
    display: block;
    background: var(--button);
    color: white;
    text-decoration: none;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 12px;
    font-weight: 600;
    transition: .2s;
}

.link:hover {
    background: var(--button-hover);
}

.footer {
    margin-top: 25px;
    font-size: 14px;
    opacity: .6;
}
</style>
</head>

<body>

<div class="card">

    <div class="banner"></div>

    <img src="IMG_1141.jpeg" alt="Profile Picture" class="profile">

    <div class="content">

        <h1>Ms. Ashlyn Baugher</h1>

        <p class="subtitle">
            Connect with me!
        </p>

        <p class="bio">
         Rates, specialties, or a short professional bio can go here.
        </p>

        <a class="link" href="https://instagram.com">
            Instagram
        </a>

        <a class="link" href="https://www.facebook.com/share/1CmH8o6DLt/?mibextid=wwXIfr">
            Facebook
        </a>

        <a class="link" href="https://linkedin.com/in/">
            LinkedIn
        </a>

        <a class="link" href="mailto:baugherashlyn@gmail.com">
            Email Me
        </a>

        <a class="link" href="tel:+16207199572">
            Call Me
        </a>

        <a class="link" href="sms:+16207199572">
            Text Me
        </a>

        <div class="footer">
            Thanks for visiting!
        </div>

    </div>

</div>

</body>
</html>
