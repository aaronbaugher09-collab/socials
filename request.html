<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book a Consultation</title>

<link rel="icon" href="favicon.png">

<style>

:root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --button: #AD9D90;
    --button-hover: #BEBEBB;
}

body {
    margin:0;
    padding:30px 15px;
    font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
}

.card {
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1 {
    text-align:center;
}

label {
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:600;
}

input,
textarea,
select {
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
    font-family:inherit;
    background:white;
}

textarea {
    height:100px;
    resize:none;
}


/* Validation */

input.invalid,
select.invalid,
textarea.invalid {
    border:2px solid #d9534f;
}

.error-message {
    color:#d9534f;
    font-size:14px;
    margin-top:5px;
    display:none;
}


/* Button */

.cta-button {
    width:100%;
    margin-top:25px;
    background:var(--button);
    color:white;
    border:none;
    padding:16px;
    border-radius:14px;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition:.25s ease;
}

.cta-button:hover {
    background:var(--button-hover);
    transform:translateY(-3px);
    box-shadow:0 8px 15px rgba(0,0,0,.2);
}

</style>

</head>


<body>

<div class="card">

<h1>
Book a Consultation
</h1>


<form id="nannyForm">


<label>Name</label>

<input
    id="name"
    type="text"
    placeholder="Your Name"
    required
>



<label>Phone Number</label>

<input
    id="phone"
    type="tel"
    placeholder="555-123-4567"
    required
>

<div id="phoneError" class="error-message">
    Please enter a valid 10-digit phone number.
</div>



<label>Email</label>

<input
    id="email"
    type="email"
    placeholder="example@email.com"
    required
>

<div id="emailError" class="error-message">
    Please enter a valid email address.
</div>



<label>Preferred Contact Method</label>

<select id="contactMethod" required>

    <option value="">Select an option</option>
    <option value="Text Message">Text Message</option>
    <option value="Phone Call">Phone Call</option>
    <option value="Email">Email</option>

</select>



<label>Number of Children</label>

<input 
    id="children"
    type="number"
    min="1"
    step="1"
    required
>

<div id="childrenError" class="error-message">
    Please enter at least 1 child.
</div>



<label>Children's Ages</label>

<input
    id="ages"
    type="text"
    placeholder="Example: 6 months, 2 years, and 5 years"
    required
>

<div id="agesError" class="error-message">
    Please enter the children's ages.
</div>



<label>Type of Care Needed</label>

<select id="careType" required>

    <option value="">Select an option</option>
    <option value="Weekly">Weekly</option>
    <option value="One Time">One Time</option>
    <option value="Part Time">Part Time</option>
    <option value="Full Time">Full Time</option>
    <option value="Occasional / As Needed">
        Occasional / As Needed
    </option>

</select>



<label>Preferred Start Date</label>

<input
    id="startDate"
    type="date"
    required
>



<label>Typical Hours Needed</label>

<input 
    id="hours"
    type="text"
    placeholder="Example: Monday-Friday 8am-4pm"
    required
>



<label>Message</label>

<textarea 
    id="message"
    placeholder="Anything else you would like Ashlyn to know?"
></textarea>



<button 
    class="cta-button" 
    type="submit">
    Send Request
</button>


<p id="status"></p>


</form>

</div>



<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>


<script>

// Phone Validation

const phone = document.getElementById("phone");

function validatePhone(){

    const digits = phone.value.replace(/\D/g,'');

    if(phone.value !== "" && digits.length !== 10){

        phone.classList.add("invalid");
        document.getElementById("phoneError").style.display="block";
        return false;

    }

    phone.classList.remove("invalid");
    document.getElementById("phoneError").style.display="none";
    return true;

}



// Email Validation

const email = document.getElementById("email");

function validateEmail(){

    const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(email.value !== "" && !emailPattern.test(email.value)){

        email.classList.add("invalid");
        document.getElementById("emailError").style.display="block";
        return false;

    }

    email.classList.remove("invalid");
    document.getElementById("emailError").style.display="none";
    return true;

}



// Children Validation

const children = document.getElementById("children");

function validateChildren(){

    if(children.value !== "" && children.value < 1){

        children.classList.add("invalid");
        document.getElementById("childrenError").style.display="block";
        return false;

    }

    children.classList.remove("invalid");
    document.getElementById("childrenError").style.display="none";
    return true;

}



// Ages Validation

const ages = document.getElementById("ages");

function validateAges(){

    if(ages.value !== "" && !/[0-9]/.test(ages.value)){

        ages.classList.add("invalid");
        document.getElementById("agesError").style.display="block";
        return false;

    }

    ages.classList.remove("invalid");
    document.getElementById("agesError").style.display="none";
    return true;

}



phone.addEventListener("input", validatePhone);
phone.addEventListener("blur", validatePhone);

email.addEventListener("input", validateEmail);
email.addEventListener("blur", validateEmail);

children.addEventListener("input", validateChildren);
ages.addEventListener("input", validateAges);



// Prevent past dates

const today = new Date()
.toISOString()
.split("T")[0];

document
.getElementById("startDate")
.setAttribute("min", today);



// Stop invalid submissions

document
.getElementById("nannyForm")
.addEventListener("submit", function(e){

    if(
        !validatePhone() ||
        !validateEmail() ||
        !validateChildren() ||
        !validateAges()
    ){

        e.preventDefault();

    }

});

</script>


<script src="form.js"></script>


</body>

</html>
